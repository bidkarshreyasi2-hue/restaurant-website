<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order | Saoji Tadka</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site"><div class="wrap">
<a class="logo" href="index.html">Saoji <span>Tadka</span></a>
<nav aria-label="Main"><a href="index.html" >Home</a><a href="menu.html" >Menu</a><a href="order.html" aria-current="page">Order</a></nav>
</div></header>
<main><section><div class="wrap">
<h1 style="font-size:2.6rem;letter-spacing:-.03em;margin-bottom:2rem">Place your order</h1>
<div class="order-grid">
<div id="items" aria-label="Dishes"></div>
<aside class="cart" aria-live="polite">
<h2 style="font-size:1.3rem">Your order</h2>
<ul id="cart-list"><li>Nothing added yet. Pick a dish to start.</li></ul>
<div class="total"><span>Total</span><span id="total">₹0</span></div>
<label for="name">Name</label><input id="name" autocomplete="name">
<label for="phone">Phone</label><input id="phone" inputmode="tel" autocomplete="tel">
<label for="note">Spice level or notes</label><textarea id="note" rows="2"></textarea>
<p style="margin-top:1rem"><button class="btn" id="place" disabled>Place order</button></p>
<div class="msg" id="msg" role="status"></div>
</aside>
</div></div></section></main>
<footer><div class="wrap">Saoji Tadka, Dharampeth, Nagpur · Open daily 11 am to 11 pm · Deployed by Jenkins on AWS EC2</div></footer>
<script src="js/order.js"></script>
</body></html>
